<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 技术面试官 · 王哥</title>
    <style>
        * { box-sizing: border-box; }

        /* 隐藏滚轮条，但保留滚动能力：滚轮条只是视觉干扰，
           聊天内容多时依然能上下翻，页面也不会因为滚动条出现而左右跳动。
           两条要一起写：scrollbar-width 管 Firefox，::-webkit-scrollbar 管 Chrome、Edge、Safari。 */
        html, body, #chat, #msg { scrollbar-width: none; }
        html::-webkit-scrollbar, body::-webkit-scrollbar,
        #chat::-webkit-scrollbar, #msg::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* 页面底色、主容器、聊天区用完全相同的灰白，内外融为一体，不再出现"框中框"。
           只有输入卡片是纯白，学生一眼就知道该在哪里打字。 */
        :root {
            --gray-bg: #f0f2f5;
            --text: #1f2937;
        }

        /* 左右 padding 归零，让下面 .wrap 的 80% 精确等于整个网页宽度的 80%。
           底部留白也去掉，输入卡片才能往下贴到屏幕底边；顶部只留窄窄一条。 */
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: var(--gray-bg);
            margin: 0;
            padding: 12px 0 0;
            color: var(--text);
        }

        /* 主容器用 column，让聊天区自动吃掉剩余高度，输入卡片始终贴底。
           width 取网页的 80% 并自动居中；同色背景不需要阴影或边框去勾轮廓。
           body 顶部占了 12px，所以高度减 12px，整页正好一屏，不会冒出纵向滚动条。 */
        .wrap {
            width: 80%;
            margin: 0 auto;
            background: var(--gray-bg);
            border-radius: 22px;
            padding: 10px 20px 8px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 12px);
            min-height: 560px;
        }

        /* 顶部：标题靠左、导出按钮靠右，flex 让两端自然分开。
           整个标题栏只占一行文字的高度，不额外加上下留白，把垂直空间尽量让给聊天区。 */
        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0;
            flex-shrink: 0;
        }

        .title { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); }

        /* 按钮要显式写 border: none，否则浏览器会给 button 套上默认的立体边框。
           上下 padding 压到最小，让按钮和标题一样只有一行文字那么高。 */
        .export-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 10px;
            font-size: 12px;
            color: #4b5563;
            border: none;
            border-radius: 999px;
            cursor: pointer;
        }
        .export-btn:hover { background: #d9dee5; }
        .export-btn svg { width: 24px; height: 24px; }

        /* 聊天区与主容器同色、无边框，靠气泡自身的颜色区分内容 */
        #chat {
            flex: 1;
            min-height: 0;
            margin: 14px 0;
            padding: 8px 6px;
            background: var(--gray-bg);
            border-radius: 16px;
            overflow-y: auto;
        }

        /* 左右交互式对话：一行一个消息，靠 justify-content 决定靠左还是靠右 */
        .row { display: flex; margin: 10px 4px; }
        .row.me { justify-content: flex-end; }
        .row.ai { justify-content: flex-start; }

        .bubble {
            max-width: 76%;
            padding: 10px 15px;
            font-size: 14px;
            line-height: 1.7;
            border-radius: 18px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        /* 用户：浅蓝；AI：和主题一致的灰白。靠颜色和位置就能分清谁说的。 */
        .bubble.me { background: #d8e8fb; color: #1e3a5f; border-bottom-right-radius: 6px; }
        .bubble.ai { background: #e6e9ee; color: #374151; border-bottom-left-radius: 6px; }

        /* 输入卡片：整页唯一的纯白块，靠颜色对比和柔和阴影区分，不再描边。
           column 布局把"文本区"和"底部按钮行"分成上下两层，
           文字再多也只在文本区里滚动，不会盖住下面放发送按钮的那一行。 */
        .composer {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 12px 14px 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 16px rgba(31, 41, 55, 0.06);
        }

        #msg {
            width: 100%;
            min-height: 52px;
            max-height: 160px;
            border: none;
            outline: none;
            resize: none;
            overflow-y: auto;
            background: #ffffff;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }
        #msg::placeholder { color: #9aa1ad; }

        .composer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            flex-shrink: 0;
        }
        .hint { font-size: 12px; color: #9aa1ad; }

        /* 发送按钮：蓝色圆形，放在底部一行的最右侧 */
        .send-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #2f7cf6;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
        .send-btn:hover { background: #1d4ed8; }
        .send-btn svg { width: 20px; height: 20px; }

        /* 评分卡：去掉灰色外框线，只保留左侧蓝色竖条作为视觉标识 */
        .card {
            border-left: 4px solid #2f7cf6;
            border-radius: 14px;
            padding: 14px 16px;
            margin: 10px 4px;
            background: #f7f8fa;
        }
        .card .score-line { display: flex; align-items: baseline; gap: 8px; }
        .card .score { font-size: 30px; font-weight: bold; color: #2f7cf6; }
        .card .score .denom { font-size: 14px; color: #9ca3af; font-weight: normal; }
        .card .pass { color: #16a34a; font-size: 13px; }
        .card .fail { color: #dc2626; font-size: 13px; }
        .card h4 { margin: 10px 0 4px; font-size: 12px; color: #6b7280; font-weight: normal; letter-spacing: 0.5px; }
        .card ul { margin: 0; padding-left: 18px; }
        .card li.good { color: #16a34a; font-size: 13px; line-height: 1.7; }
        .card li.bad { color: #dc2626; font-size: 13px; line-height: 1.7; }
        .card .sugg { background: #fef3c7; border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 13px; color: #92400e; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="head">
            <h1 class="title">AI 技术面试官 · 王哥</h1>
            <button class="export-btn" onclick="exportReport()" title="导出报告">
                <svg viewBox="0 0 1024 1024" width="24" height="24" aria-hidden="true" focusable="false"><path d="M892.7 559.5c-26.1 0-41.8 15.7-41.8 41.8v52.2c0 88.8-5.2 156.6-167.1 156.6H349.6c-167.1 0-167.1-73.1-167.1-167.1V434.1C172.1 303.6 234.8 277.5 307.9 267h5.2c26.1 0 41.8-15.7 41.8-41.8s-15.7-41.8-41.8-41.8h-47C177.3 183.5 99 256.6 99 350.6v370.7c0 88.8 73.1 167.1 167.1 167.1h496.1c88.8 0 167.1-73.1 167.1-167.1V596c5.2-15.7-15.7-36.5-36.6-36.5z m-642.3 20.8c0 41.8 10.4 83.5 20.9 120.1 47-135.8 172.3-235 323.7-235v52.2c0 20.9 10.4 41.8 31.3 52.2 10.4 5.2 15.7 10.4 26.1 10.4 10.4 0 26.1-5.2 31.3-10.4l229.8-177.5c10.4-10.4 20.9-31.3 20.9-52.2 0-15.7-10.4-36.6-20.9-47L683.8 115.6c-10.4-10.4-26.1-10.4-36.6-10.4s-15.7 0-26.1 10.4c-20.9 10.4-31.3 31.3-31.3 52.2v57.4c-187.9 0.1-339.4 156.7-339.4 355.1z" fill="currentColor"/></svg>
            </button>
        </div>
        <div id="chat"></div>
        <div class="composer">
            <textarea id="msg" rows="2" placeholder="输入你的回答，Enter 发送，Shift+Enter 换行" autocomplete="off"></textarea>
            <div class="composer-bar">
                <span class="hint">Enter 发送，Shift+Enter 换行</span>
                <button class="send-btn" onclick="sendStream()" title="发送">
                    <svg viewBox="0 0 1024 1024" width="20" height="20" aria-hidden="true" focusable="false"><path d="M925.558 97.72c-0.292-0.154-1.582-0.719-4.739-0.719-2.941 0-8.151 0.521-16.343 2.979-36.058 12.923-754.37 270.362-773.606 276.872-0.939 0.318-1.934 0.651-2.974 0.999-6.376 2.134-14.312 4.789-21.199 7.962-4.428 2.04-7.167 3.719-8.829 4.928 17.832 15.715 119.575 97.983 147.656 120.663l564.222-327.071-432.705 429.86 50.076 61.687-0.298 0.242c71.737 87.846 178.502 218.056 196.953 239.206 3.79-4.609 9.658-15.269 13.893-31.349l0.32-1.068c4.197-12.448 271.564-726.894 284.955-762.677 5.193-16.388 2.925-21.894 2.618-22.514z" fill="currentColor"/><path d="M360.942 646.668l-23.209 58.122 1.062-0.53 22.366-57.321z" fill="currentColor"/><path d="M952.158 78.229c-4.725-6.476-13.998-14.195-31.339-14.195-7.7 0-16.304 1.478-26.303 4.516l-0.769 0.254c-7.542 2.703-754.41 270.378-773.445 276.821-0.906 0.307-1.865 0.628-2.868 0.962-20.672 6.918-48.985 16.392-53.687 38.008-1.601 7.358-0.929 18.539 11.361 30.017l0.284 0.257c17.603 15.689 128.736 105.481 152.37 124.56l59.231 227.524 31.165-15.563 0.833 0.333 0.373-0.935 89.425-44.655c39.865 48.793 184.043 225.075 193.933 234.965l0.122 0.056c7.568 7.413 15.352 8.846 20.552 8.846h0.007c12.054 0 22.763-7.486 31.827-22.486 5.649-9.349 10.661-21.497 14.14-34.496 7.164-20.075 188.713-505.43 284.587-761.613l0.259-0.747c7.436-23.193 6.761-40.343-2.058-52.429z m-314.493 805.75c-4.234 16.08-10.103 26.74-13.893 31.349-18.451-21.149-125.216-151.36-196.953-239.206l0.298-0.242-50.076-61.687 432.705-429.86-564.222 327.071c-28.08-22.68-129.823-104.948-147.656-120.663 1.661-1.209 4.401-2.889 8.829-4.928 6.886-3.173 14.823-5.828 21.199-7.962 1.04-0.348 2.035-0.681 2.974-0.999 19.236-6.51 737.548-263.949 773.606-276.872 8.192-2.458 13.402-2.979 16.343-2.979 3.157 0 4.447 0.565 4.739 0.719 0.307 0.62 2.575 6.125-2.617 22.513-13.391 35.783-280.759 750.229-284.955 762.677l-0.321 1.069zM337.733 704.79l23.208-58.122 0.22 0.27 30.678 37.792-58.245 32.857 5.2-13.328-1.061 0.531z m267.594-363.852l-259.134 257.43-2.423 2.408-40.964 102.585-41.809-162.821 344.33-199.602z" fill="currentColor"/><path d="M343.769 600.777l2.423-2.408 259.135-257.431-344.331 199.603 41.808 162.821z" fill="currentColor"/><path d="M391.84 684.731l-30.679-37.792-22.366 57.321-5.201 13.328z" fill="currentColor"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 记住上一轮出的题：学生答的是"上一道题"，评分卡要用它去请求评分接口。
        let lastQuestion = "";

        // 输入框换成多行后，内容变多时要自己长高，但最多到 160px 就内部滚动，
        // 这样下面的按钮行始终留在原地，不会被长文字顶掉或盖住。
        const msgEl = document.getElementById('msg');
        function autoGrow() {
            msgEl.style.height = 'auto';
            msgEl.style.height = Math.max(52, Math.min(msgEl.scrollHeight, 160)) + 'px';
        }
        msgEl.addEventListener('input', autoGrow);

        // 为什么直接开一个新地址、而不是用 fetch 拿文本：
        // 后端这个接口带 Content-Disposition: attachment，浏览器会把响应当成文件下载。
        function exportReport() {
            window.open('/api/report', '_blank');
        }

        // 每条消息包一层 row（决定靠左还是靠右），里面才是气泡。
        // 用 textContent 而不是拼 innerHTML，是为了不让用户输入里夹的尖括号被当成标签执行。
        function push(text, cls) {
            const chat = document.getElementById('chat');
            const row = document.createElement('div');
            row.className = 'row ' + cls;
            const bubble = document.createElement('div');
            bubble.className = 'bubble ' + cls;
            bubble.textContent = text;
            row.appendChild(bubble);
            chat.appendChild(row);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }

        // 流式发送：一边把面试官的话逐字贴上去，一边收集本轮的判定结果
        async function sendStream() {
            const msg = msgEl.value.trim();
            if (!msg) return;

            push(msg, 'me');
            msgEl.value = '';
            autoGrow();

            // 先放一个空的 AI 气泡，后面收到的字都往同一个节点贴，
            // 才有"一个字一个字冒出来"的打字机效果。
            const aiBubble = push('', 'ai');

            // 走 Agent 的流式接口：只有它才知道本轮有没有打分、出了哪道题。
            const res = await fetch('/api/agent_stream', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            const chat = document.getElementById('chat');
            let scored = false;
            let question = '';
            let buffer = '';

            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, {stream: true});
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const payload = line.slice(6).trim();
                    if (!payload || payload === '[DONE]') continue;
                    const obj = JSON.parse(payload);
                    if (obj.type === 'meta') {
                        scored = obj.scored;
                        question = obj.question;
                    } else {
                        aiBubble.textContent += obj.text;
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
            }

            if (buffer.startsWith('data: ')) {
                const payload = buffer.slice(6).trim();
                if (payload && payload !== '[DONE]') {
                    const obj = JSON.parse(payload);
                    if (obj.type === 'meta') {
                        scored = obj.scored;
                        question = obj.question;
                    } else {
                        aiBubble.textContent += obj.text;
                    }
                }
            }

            // 学生答的是上一轮出的题，用本轮新题去评分会对不上。
            const questionBefore = lastQuestion;
            if (question) lastQuestion = question;

            // 只有后端真的打过分、且之前确实有题，才弹评分卡。
            if (scored && questionBefore) {
                await showCard(questionBefore, msg);
            }
        }

        // 一次性发送：留作对比，走 /api/chat，回答整段出现
        async function send() {
            const msg = msgEl.value.trim();
            if (!msg) return;

            push(msg, 'me');
            msgEl.value = '';
            autoGrow();

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const data = await res.json();

            push(data.reply, 'ai');

            const questionBefore = lastQuestion;
            if (data.question) lastQuestion = data.question;

            if (data.scored && questionBefore) {
                await showCard(questionBefore, msg);
            }
        }

        // 评分卡：把后端返回的 5 个字段拼成一张 HTML 卡片，不引入任何前端库
        async function showCard(question, answer) {
            const res = await fetch('/api/score', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question: question, answer: answer})
            });
            const c = await res.json();

            let html = '<div class="card">';
            html += '<div class="score-line">';
            html += '<span class="score">' + c.score + '<span class="denom"> / 10</span></span>';
            html += c.pass_flag ? '<span class="pass">通过</span>' : '<span class="fail">未通过</span>';
            html += '</div>';
            html += '<h4>做得好的</h4><ul>';
            c.strengths.forEach(function (s) { html += '<li class="good">' + s + '</li>'; });
            html += '</ul>';
            html += '<h4>漏掉的要点</h4><ul>';
            c.weaknesses.forEach(function (w) { html += '<li class="bad">' + w + '</li>'; });
            html += '</ul>';
            html += '<div class="sugg">建议：' + c.suggestion + '</div>';
            html += '</div>';

            // 用一个新节点装卡片再 append，避免 chat.innerHTML += 把已有气泡全部重建。
            const card = document.createElement('div');
            card.innerHTML = html;
            const chat = document.getElementById('chat');
            chat.appendChild(card.firstElementChild);
            chat.scrollTop = chat.scrollHeight;
        }

        // 多行输入下：Enter 发送，Shift+Enter 才是换行。
        // preventDefault 是必须的，否则 Enter 会先在 textarea 里插一个换行。
        msgEl.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendStream();
            }
        });
    </script>
</body>
</html>
